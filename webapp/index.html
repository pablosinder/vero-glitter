<!DOCTYPE html>
<html>
<head>

	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Shopping Cart</title>

	<!-- keep index.html mocked as well for consistency -->
	<script
		id='sap-ui-bootstrap'
		src='../../../../../../resources/sap-ui-core.js'
		data-sap-ui-theme='sap_horizon'
		data-sap-ui-compat-version="edge"
		data-sap-ui-async="true"
		data-sap-ui-on-init="module:com/veroglitter/initMockServer"
		data-sap-ui-resource-roots='{
			"com.veroglitter" : "./",
			"com.veroglitter.mock": "./localService/mockdata"
		}'>
	</script>

</head>
<body class='sapUiBody' id='content'>
	<div data-sap-ui-component data-name="com.veroglitter" data-id="container" data-settings='{"id" : "cart"}'></div>
</body>
</html>
