specVersion: "4.0"
metadata:
  name: com.veroglitter
type: application
framework:
  name: OpenUI5
  version: "1.141.2"
  libraries:
    - name: sap.m
    - name: sap.f
    - name: sap.ui.layout
    - name: sap.ui.documentation
    - name: sap.ui.core
    - name: themelib_sap_horizon
builder:
  resources:
    excludes:
      - "test/e2e/**"
server:
  customMiddleware:
  - name: fiori-tools-appreload
    afterMiddleware: compression
    configuration:
      path: webapp
      delay: 300
  # - name: ui5-middleware-livereload
  #   afterMiddleware: compression
  #   configuration:
  #     debug: true
  #     extraExts: "xml,json,properties"
  #     path: webapp
  - name: "@ui5/middleware-code-coverage"
    afterMiddleware: compression
    configuration:
      excludePatterns:
        - "resources/"
        - "test/"